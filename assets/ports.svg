<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
  <title id="t">Ports and network paths</title>
  <desc id="d">Network diagram. People on the internet connect to the router's public IPv4 address. The router forwards TCP 8080, UDP 9000 and UDP 9001 to the server PC at a LAN address such as 192.168.1.20, either automatically with UPnP or by manual forwarding. People on the same LAN connect to the server PC directly. On the server PC, TCP 8080 carries the HTTPS and WSS control channel, UDP 9000 carries encrypted GCA3 voice, UDP 9001 carries WebRTC screen sharing, and TCP 9090 is the control panel, reachable only from 127.0.0.1 and never forwarded. Without a public IPv4 address, for example behind CGNAT, the server cannot be reached directly from outside.</desc>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ededf0"/></marker>
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3 12h18"/></g></symbol>
    <symbol id="i-router" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 13V7M17 13V7"/></g><circle cx="7.5" cy="16.5" r="1.1" fill="currentColor"/><circle cx="11" cy="16.5" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-dns" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/></g><circle cx="8" cy="7.25" r="1.2" fill="currentColor"/><circle cx="8" cy="16.75" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16v4"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.5 21.5 20h-19z"/><path d="M12 10v4.5M12 17.4v.1"/></g></symbol>
  </defs>
  <style>
    .t{font-family:Manrope,'Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',Consolas,monospace}
    .box{fill:#131316;stroke:#ffffff;stroke-opacity:.1}
    .tcp{fill:#232327}
    .udp{fill:#46c07a;fill-opacity:.14}
  </style>

  <rect x="0.5" y="0.5" width="1199" height="619" rx="24" fill="#08080a" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="40" y="62" class="t" font-size="22" font-weight="800" fill="#ededf0">Ports and network paths</text>
  <text x="40" y="88" class="t" font-size="14" fill="#a0a0a8">Default ports shown. Each one can be changed in the control panel.</text>

  <!-- Internet side -->
  <rect x="40.5" y="130.5" width="249" height="169" rx="16" class="box"/>
  <use href="#i-globe" x="60" y="150" width="28" height="28" color="#ededf0"/>
  <text x="60" y="206" class="t" font-size="15" font-weight="700" fill="#ededf0">People on the internet</text>
  <text x="60" y="228" class="t" font-size="12.5" fill="#a0a0a8">use the public IPv4 invite</text>
  <text x="60" y="264" class="m" font-size="11.5" fill="#c8c8cf">203.0.113.42:8080#5482…</text>

  <line x1="296" y1="215" x2="374" y2="215" stroke="#ededf0" stroke-width="2" marker-start="url(#aw)" marker-end="url(#aw)"/>

  <!-- Router -->
  <rect x="380.5" y="120.5" width="319" height="249" rx="16" class="box"/>
  <use href="#i-router" x="400" y="138" width="26" height="26" color="#ededf0"/>
  <text x="436" y="157" class="t" font-size="15" font-weight="700" fill="#ededf0">Your router</text>
  <text x="400" y="186" class="m" font-size="12" fill="#c8c8cf">public IPv4 203.0.113.42</text>
  <text x="400" y="212" class="t" font-size="12.5" fill="#a0a0a8">UPnP (automatic) or manual forwarding</text>
  <g class="m" font-size="12.5">
    <rect x="400" y="228" width="40" height="22" rx="6" class="tcp"/><text x="420" y="243.5" fill="#ededf0" text-anchor="middle" font-size="11">TCP</text>
    <text x="452" y="244" fill="#ededf0">8080  →  192.168.1.20</text>
    <rect x="400" y="262" width="40" height="22" rx="6" class="udp"/><text x="420" y="277.5" fill="#7fe0a6" text-anchor="middle" font-size="11">UDP</text>
    <text x="452" y="278" fill="#ededf0">9000  →  192.168.1.20</text>
    <rect x="400" y="296" width="40" height="22" rx="6" class="udp"/><text x="420" y="311.5" fill="#7fe0a6" text-anchor="middle" font-size="11">UDP</text>
    <text x="452" y="312" fill="#ededf0">9001  →  192.168.1.20</text>
  </g>
  <text x="400" y="346" class="t" font-size="11.5" fill="#82828b">UPnP leases last 1 hour and renew every 20 minutes</text>

  <line x1="706" y1="215" x2="784" y2="215" stroke="#ededf0" stroke-width="2" marker-start="url(#aw)" marker-end="url(#aw)"/>

  <!-- LAN side -->
  <rect x="380.5" y="400.5" width="319" height="109" rx="16" class="box"/>
  <use href="#i-monitor" x="400" y="418" width="26" height="26" color="#ededf0"/>
  <text x="436" y="437" class="t" font-size="15" font-weight="700" fill="#ededf0">People on your LAN</text>
  <text x="400" y="468" class="t" font-size="12.5" fill="#a0a0a8">connect to 192.168.1.20 directly;</text>
  <text x="400" y="488" class="t" font-size="12.5" fill="#a0a0a8">no router forwarding needed</text>
  <line x1="706" y1="455" x2="784" y2="455" stroke="#ededf0" stroke-width="2" marker-start="url(#aw)" marker-end="url(#aw)"/>

  <!-- Server PC -->
  <rect x="790.5" y="110.5" width="369" height="399" rx="18" class="box"/>
  <use href="#i-dns" x="810" y="128" width="26" height="26" color="#ededf0"/>
  <text x="846" y="147" class="t" font-size="15" font-weight="700" fill="#ededf0">Server PC</text>
  <text x="810" y="176" class="m" font-size="12" fill="#c8c8cf">LAN address 192.168.1.20</text>

  <g class="t">
    <rect x="810.5" y="192.5" width="329" height="67" rx="12" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="824" y="206" width="40" height="22" rx="6" class="tcp"/><text x="844" y="221.5" class="m" font-size="11" fill="#ededf0" text-anchor="middle">TCP</text>
    <text x="876" y="222" class="m" font-size="15" font-weight="700" fill="#ededf0">8080</text>
    <text x="930" y="222" font-size="13.5" font-weight="700" fill="#ededf0">Control</text>
    <text x="824" y="247" font-size="12" fill="#a0a0a8">HTTPS / WSS · sign-in, chat, files</text>

    <rect x="810.5" y="269.5" width="329" height="67" rx="12" fill="#1a1a1d" stroke="#46c07a" stroke-opacity="0.4"/>
    <rect x="824" y="283" width="40" height="22" rx="6" class="udp"/><text x="844" y="298.5" class="m" font-size="11" fill="#7fe0a6" text-anchor="middle">UDP</text>
    <text x="876" y="299" class="m" font-size="15" font-weight="700" fill="#ededf0">9000</text>
    <text x="930" y="299" font-size="13.5" font-weight="700" fill="#ededf0">Voice</text>
    <text x="824" y="324" font-size="12" fill="#a0a0a8">GCA3 · Opus, ChaCha20-Poly1305</text>

    <rect x="810.5" y="346.5" width="329" height="67" rx="12" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="824" y="360" width="40" height="22" rx="6" class="udp"/><text x="844" y="375.5" class="m" font-size="11" fill="#7fe0a6" text-anchor="middle">UDP</text>
    <text x="876" y="376" class="m" font-size="15" font-weight="700" fill="#ededf0">9001</text>
    <text x="930" y="376" font-size="13.5" font-weight="700" fill="#ededf0">Screen share</text>
    <text x="824" y="401" font-size="12" fill="#a0a0a8">WebRTC · DTLS-SRTP</text>

    <rect x="810.5" y="423.5" width="329" height="67" rx="12" fill="#0f0f11" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="4 3"/>
    <rect x="824" y="437" width="40" height="22" rx="6" class="tcp"/><text x="844" y="452.5" class="m" font-size="11" fill="#ededf0" text-anchor="middle">TCP</text>
    <text x="876" y="453" class="m" font-size="15" font-weight="700" fill="#ededf0">9090</text>
    <text x="930" y="453" font-size="13.5" font-weight="700" fill="#ededf0">Control panel</text>
    <use href="#i-lock" x="823" y="466" width="14" height="14" color="#a0a0a8"/>
    <text x="843" y="478" font-size="12" fill="#a0a0a8">127.0.0.1 only · never forward it</text>
  </g>

  <!-- CGNAT warning -->
  <rect x="40.5" y="546.5" width="1119" height="47" rx="14" fill="#e5484d" fill-opacity="0.08" stroke="#e5484d" stroke-opacity="0.4"/>
  <use href="#i-warn" x="58" y="558" width="22" height="22" color="#ff8a8d"/>
  <text x="92" y="575" class="t" font-size="13.5" fill="#c8c8cf"><tspan font-weight="700" fill="#ff8a8d">No public IPv4?</tspan> Behind CGNAT (100.64.0.0/10) or a router with a private WAN address, people outside your network cannot reach the server directly.</text>
</svg>
