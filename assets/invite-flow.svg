<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Host, copy the invite, connect</title>
  <desc id="d">Three steps. 1, Host: install Onset Host and open its control panel; the server creates its identity on first start. 2, Copy invite: the panel shows an invite such as 203.0.113.42:8080 followed by a hash sign and the server's SHA-256 fingerprint. 3, Connect: paste the invite into the Server address field of the desktop app; the app shows that 203.0.113.42:8080 answered, checks the fingerprint and pins the identity.</desc>
  <defs>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g></symbol>
    <clipPath id="c2"><rect x="460" y="284" width="156" height="34"/></clipPath>
    <clipPath id="c3"><rect x="848" y="284" width="280" height="34"/></clipPath>
  </defs>
  <style>
    .t{font-family:Manrope,'Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',Consolas,monospace}
  </style>

  <rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="#08080a" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="40" y="62" class="t" font-size="22" font-weight="800" fill="#ededf0">Host, copy the invite, connect</text>
  <text x="40" y="88" class="t" font-size="14" fill="#a0a0a8">The invite carries the address and the server's SHA-256 fingerprint, so even the first connection is verified.</text>

  <!-- chevrons -->
  <path d="M400 238l10 12-10 12M410 238l10 12-10 12" fill="none" stroke="#82828b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4 0)"/>
  <path d="M788 238l10 12-10 12M798 238l10 12-10 12" fill="none" stroke="#82828b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4 0)"/>

  <!-- 1 Host -->
  <rect x="40.5" y="120.5" width="343" height="259" rx="18" fill="#131316" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="74" cy="153" r="16" fill="#46c07a" fill-opacity="0.12" stroke="#46c07a" stroke-width="1.5"/>
  <text x="74" y="158" class="t" font-size="14" font-weight="800" fill="#7fe0a6" text-anchor="middle">1</text>
  <text x="102" y="159" class="t" font-size="18" font-weight="700" fill="#ededf0">Host</text>
  <g class="t" font-size="13.5" fill="#a0a0a8">
    <text x="64" y="196">Install Onset Host and open its</text>
    <text x="64" y="216">control panel. The server creates its</text>
    <text x="64" y="236">identity the first time it starts.</text>
  </g>
  <rect x="64.5" y="258.5" width="295" height="97" rx="12" fill="#0f0f11" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- Onset mark: scripts/brand/app-icon.svg -->
  <linearGradient id="onsetMarkT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232327"/><stop offset="1" stop-color="#131316"/></linearGradient>
  <linearGradient id="onsetMarkB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe0a6"/><stop offset="1" stop-color="#46c07a"/></linearGradient>
  <rect x="80" y="272" width="28" height="28" rx="6.3" fill="url(#onsetMarkT)" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="85.1" y="284.25" width="3.5" height="7" rx="1.75" fill="url(#onsetMarkB)"/>
  <rect x="89.77" y="279.58" width="3.5" height="12.83" rx="1.75" fill="url(#onsetMarkB)"/>
  <rect x="94.73" y="281.33" width="3.5" height="10.5" rx="1.75" fill="url(#onsetMarkB)"/>
  <rect x="99.4" y="285.42" width="3.5" height="4.67" rx="1.75" fill="url(#onsetMarkB)"/>
  <text x="118" y="284" class="t" font-size="13" font-weight="700" fill="#ededf0">Onset Host</text>
  <text x="118" y="300" class="t" font-size="11.5" fill="#82828b">Local control panel</text>
  <rect x="80.5" y="316.5" width="127" height="25" rx="12.5" fill="#0c0c0e" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="96" cy="329" r="4" fill="#46c07a"/>
  <text x="108" y="333" class="t" font-size="12" font-weight="600" fill="#ededf0">Server online</text>

  <!-- 2 Copy invite -->
  <rect x="428.5" y="120.5" width="343" height="259" rx="18" fill="#131316" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="462" cy="153" r="16" fill="#46c07a" fill-opacity="0.12" stroke="#46c07a" stroke-width="1.5"/>
  <text x="462" y="158" class="t" font-size="14" font-weight="800" fill="#7fe0a6" text-anchor="middle">2</text>
  <text x="490" y="159" class="t" font-size="18" font-weight="700" fill="#ededf0">Copy invite</text>
  <g class="t" font-size="13.5" fill="#a0a0a8">
    <text x="452" y="196">Click Copy invite in the control panel.</text>
    <text x="452" y="216">Send it to your people, together with</text>
    <text x="452" y="236">the invite token they register with.</text>
  </g>
  <text x="452" y="276" class="t" font-size="11.5" fill="#82828b">Invite</text>
  <rect x="452.5" y="284.5" width="167" height="33" rx="9" fill="#0c0c0e" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="462" y="305.5" class="m" font-size="11.5" fill="#ededf0" clip-path="url(#c2)">203.0.113.42:8080#5482…</text>
  <rect x="628.5" y="284.5" width="119" height="33" rx="9" fill="#232327" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="688" y="305.5" class="t" font-size="12.5" font-weight="600" fill="#ededf0" text-anchor="middle">Copy invite</text>
  <text x="452" y="340" class="t" font-size="11" fill="#82828b">Server identity (SHA-256)</text>
  <text x="452" y="358" class="m" font-size="11" fill="#c8c8cf">54:82:88:0B:92:3B:FF:E4:32:6E:F8:…</text>

  <!-- 3 Connect -->
  <rect x="816.5" y="120.5" width="343" height="259" rx="18" fill="#131316" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="850" cy="153" r="16" fill="#46c07a" fill-opacity="0.12" stroke="#46c07a" stroke-width="1.5"/>
  <text x="850" y="158" class="t" font-size="14" font-weight="800" fill="#7fe0a6" text-anchor="middle">3</text>
  <text x="878" y="159" class="t" font-size="18" font-weight="700" fill="#ededf0">Connect</text>
  <g class="t" font-size="13.5" fill="#a0a0a8">
    <text x="840" y="196">Paste it into Server address in the</text>
    <text x="840" y="216">desktop app. The fingerprint is checked</text>
    <text x="840" y="236">and remembered for every later visit.</text>
  </g>
  <text x="840" y="276" class="t" font-size="11.5" fill="#82828b">Server address</text>
  <rect x="840.5" y="284.5" width="295" height="33" rx="9" fill="#17171a" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="850" y="305.5" class="m" font-size="11.5" fill="#ededf0" clip-path="url(#c3)">203.0.113.42:8080#5482880b923bffe4326ef862</text>
  <circle cx="845" cy="336" r="3.5" fill="#46c07a"/>
  <text x="856" y="340" class="t" font-size="11.5" fill="#a0a0a8">203.0.113.42:8080 answered</text>
  <use href="#i-lock" x="839" y="348" width="13" height="13" color="#46c07a"/>
  <text x="856" y="359" class="m" font-size="11" fill="#a0a0a8">Identity 54:82:88:0B:92:3B:FF:E4…</text>
</svg>
