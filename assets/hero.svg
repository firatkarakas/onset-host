<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Onset Host</title>
  <desc id="d">Onset Host banner: host Onset on your own Windows PC with one installer and a local control panel, with no domain and no certificate authority. An inset shows the control panel with the server online, its client address, the invite with a Copy invite button and the server identity fingerprint.</desc>
  <defs>
    <radialGradient id="bg" cx="18%" cy="-15%" r="85%">
      <stop offset="0" stop-color="#14261c"/>
      <stop offset="0.55" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161b"/>
      <stop offset="1" stop-color="#0f0f11"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="420" rx="24"/></clipPath>
    <clipPath id="inv"><rect x="754" y="239" width="302" height="34"/></clipPath>
  </defs>
  <style>
    .t{font-family:Manrope,'Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',Consolas,monospace}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1280" height="420" fill="url(#bg)"/>

    <rect x="64" y="72" width="12" height="12" rx="3" fill="#46c07a"/>
    <text x="86" y="83.5" class="t" font-size="13" font-weight="800" letter-spacing="1.6" fill="#a0a0a8">SELF-HOSTED SERVER · WINDOWS</text>
    <text x="62" y="146" class="t" font-size="52" font-weight="800" letter-spacing="-1.4" fill="#ededf0">Onset Host</text>
    <text x="64" y="186" class="t" font-size="21" font-weight="600" fill="#a0a0a8">Host Onset on your own Windows PC.</text>
    <text x="64" y="218" class="t" font-size="15.5" fill="#82828b">One installer and a local control panel.</text>
    <text x="64" y="240" class="t" font-size="15.5" fill="#82828b">No domain, no certificate authority, nothing to pay for.</text>

    <g class="t" font-size="13.5" font-weight="600" fill="#c8c8cf">
      <rect x="64.5" y="276.5" width="149" height="33" rx="16.5" fill="#131316" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="84" cy="293" r="4" fill="#46c07a"/><text x="97" y="298">LAN or Internet</text>
      <rect x="225.5" y="276.5" width="167" height="33" rx="16.5" fill="#131316" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="245" cy="293" r="4" fill="#46c07a"/><text x="258" y="298">UPnP port mapping</text>
      <rect x="404.5" y="276.5" width="167" height="33" rx="16.5" fill="#131316" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="424" cy="293" r="4" fill="#46c07a"/><text x="437" y="298">Encrypted backups</text>
    </g>

    <!-- Inset: the control panel's top card -->
    <rect x="720.5" y="56.5" width="495" height="307" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- Onset mark: scripts/brand/app-icon.svg -->
    <linearGradient id="onsetMarkT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232327"/><stop offset="1" stop-color="#131316"/></linearGradient>
    <linearGradient id="onsetMarkB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe0a6"/><stop offset="1" stop-color="#46c07a"/></linearGradient>
    <rect x="744" y="78" width="38" height="38" rx="8.55" fill="url(#onsetMarkT)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="750.93" y="94.62" width="4.75" height="9.5" rx="2.38" fill="url(#onsetMarkB)"/>
    <rect x="757.26" y="88.29" width="4.75" height="17.42" rx="2.38" fill="url(#onsetMarkB)"/>
    <rect x="763.99" y="90.67" width="4.75" height="14.25" rx="2.38" fill="url(#onsetMarkB)"/>
    <rect x="770.32" y="96.21" width="4.75" height="6.33" rx="2.38" fill="url(#onsetMarkB)"/>
    <text x="794" y="95" class="t" font-size="17" font-weight="700" fill="#ededf0">Onset Host</text>
    <text x="794" y="113" class="t" font-size="12" fill="#a0a0a8">Local control panel</text>
    <rect x="1054.5" y="80.5" width="141" height="31" rx="15.5" fill="#0d0d10" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="1073" cy="96" r="7.5" fill="#46c07a" fill-opacity="0.22"/>
    <circle cx="1073" cy="96" r="3.8" fill="#46c07a"/>
    <text x="1086" y="100.5" class="t" font-size="13.5" fill="#ededf0">Server online</text>
    <rect x="744" y="134" width="452" height="1" fill="#ffffff" fill-opacity="0.08"/>
    <text x="744" y="162" class="t" font-size="13" fill="#a0a0a8">Client address</text>
    <text x="744" y="192" class="m" font-size="20" font-weight="500" fill="#ededf0">https://203.0.113.42:8080</text>
    <text x="744" y="228" class="t" font-size="13" fill="#a0a0a8">Invite</text>
    <rect x="744.5" y="238.5" width="319" height="35" rx="9" fill="#0c0c0e" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="756" y="261" class="m" font-size="12.5" fill="#ededf0" clip-path="url(#inv)">203.0.113.42:8080#5482880b923bffe4326ef8…</text>
    <rect x="1072.5" y="238.5" width="123" height="35" rx="10" fill="#232327" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="1134" y="261" class="t" font-size="13.5" fill="#ededf0" text-anchor="middle">Copy invite</text>
    <text x="744" y="302" class="t" font-size="11.5" fill="#a0a0a8">Server identity (SHA-256)</text>
    <text x="744" y="322" class="m" font-size="11.5" fill="#c8c8cf">54:82:88:0B:92:3B:FF:E4:32:6E:F8:62:88:CC:DA:C0:</text>
    <text x="744" y="340" class="m" font-size="11.5" fill="#c8c8cf">C6:0B:82:B7:A8:99:6F:10:2A:FB:30:60:02:E4:2A:4C</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
