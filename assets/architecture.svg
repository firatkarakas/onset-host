<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">How Onset connects</title>
  <desc id="d">Architecture diagram. Each Onset desktop client talks to your own Onset server over three paths: an HTTPS and WebSocket control channel on TCP 8080 whose self-signed identity the client pins, encrypted Opus voice over UDP 9000 using the GCA3 protocol with ChaCha20-Poly1305, and screen sharing over UDP 9001 using WebRTC with DTLS-SRTP. The server stores data in SQLite on the same PC. A local Server Manager on 127.0.0.1:9090 controls it, and in Internet mode the router's ports are mapped with UPnP. No third-party servers are involved.</desc>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ededf0"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#46c07a"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a0a0a8"/></marker>
    <symbol id="i-monitor" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16v4"/></g></symbol>
    <symbol id="i-dns" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/></g><circle cx="8" cy="7.25" r="1.2" fill="currentColor"/><circle cx="8" cy="16.75" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></g></symbol>
    <symbol id="i-router" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 13V7M17 13V7"/></g><circle cx="7.5" cy="16.5" r="1.1" fill="currentColor"/><circle cx="11" cy="16.5" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 13h5M7 16h8"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M8.8 12l2.2 2.2 4.3-4.3"/></g></symbol>
  </defs>
  <style>
    .t{font-family:Manrope,'Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',Consolas,monospace}
  </style>

  <rect x="0.5" y="0.5" width="1199" height="639" rx="24" fill="#08080a" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="40" y="62" class="t" font-size="22" font-weight="800" fill="#ededf0">How Onset connects</text>
  <text x="40" y="88" class="t" font-size="14" fill="#a0a0a8">Three separate paths between each desktop client and your server. Default ports shown; all are configurable.</text>

  <!-- Clients -->
  <rect x="64.5" y="164.5" width="259" height="299" rx="16" fill="#0f0f11" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="52.5" y="152.5" width="259" height="299" rx="16" fill="#0f0f11" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="40.5" y="140.5" width="259" height="299" rx="16" fill="#131316" stroke="#ffffff" stroke-opacity="0.12"/>
  <use href="#i-monitor" x="62" y="160" width="30" height="30" color="#ededf0"/>
  <text x="62" y="222" class="t" font-size="17" font-weight="700" fill="#ededf0">Onset desktop</text>
  <text x="62" y="244" class="t" font-size="13" fill="#a0a0a8">One per person · Windows 10/11</text>
  <rect x="62.5" y="262.5" width="215" height="29" rx="14.5" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.16"/>
  <g fill="#ededf0" fill-opacity="0.4"><circle cx="74" cy="272" r="1.2"/><circle cx="78.5" cy="272" r="1.2"/><circle cx="74" cy="277" r="1.2"/><circle cx="78.5" cy="277" r="1.2"/><circle cx="74" cy="282" r="1.2"/><circle cx="78.5" cy="282" r="1.2"/></g>
  <rect x="120" y="268" width="84" height="18" rx="9" fill="#262629"/>
  <circle cx="131" cy="277" r="3" fill="#46c07a"/>
  <text x="140" y="281" class="t" font-size="10.5" font-weight="600" fill="#ededf0">Lobby</text>
  <g fill="#c8c8cf"><circle cx="232" cy="277" r="2"/><circle cx="246" cy="277" r="2"/><circle cx="260" cy="277" r="2"/></g>
  <use href="#i-lock" x="62" y="312" width="16" height="16" color="#46c07a"/>
  <text x="86" y="325" class="t" font-size="12.5" font-weight="700" fill="#ededf0">Pinned server identity</text>
  <text x="62" y="348" class="m" font-size="12" fill="#82828b">54:82:88:0B:…:E4:2A:4C</text>
  <text x="62" y="386" class="t" font-size="12.5" fill="#a0a0a8">Native Opus audio engine</text>
  <text x="62" y="406" class="t" font-size="12.5" fill="#a0a0a8">WebRTC screen sharing</text>

  <!-- Paths -->
  <line x1="338" y1="216" x2="574" y2="216" stroke="#ededf0" stroke-width="2" marker-start="url(#aw)" marker-end="url(#aw)"/>
  <text x="467" y="204" class="t" font-size="13" font-weight="700" fill="#ededf0" text-anchor="middle">Control · HTTPS / WSS</text>
  <text x="467" y="236" class="t" font-size="11.5" fill="#a0a0a8" text-anchor="middle">self-signed identity, pinned</text>

  <line x1="338" y1="304" x2="574" y2="304" stroke="#46c07a" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="467" y="292" class="t" font-size="13" font-weight="700" fill="#7fe0a6" text-anchor="middle">Voice · UDP</text>
  <text x="467" y="324" class="t" font-size="11.5" fill="#a0a0a8" text-anchor="middle">GCA3 · ChaCha20-Poly1305</text>

  <line x1="338" y1="392" x2="574" y2="392" stroke="#a0a0a8" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#am)" marker-end="url(#am)"/>
  <text x="467" y="380" class="t" font-size="13" font-weight="700" fill="#ededf0" text-anchor="middle">Screen share · UDP</text>
  <text x="467" y="412" class="t" font-size="11.5" fill="#a0a0a8" text-anchor="middle">WebRTC · DTLS-SRTP</text>

  <!-- Server -->
  <rect x="580.5" y="120.5" width="339" height="419" rx="18" fill="#131316" stroke="#ffffff" stroke-opacity="0.12"/>
  <use href="#i-dns" x="600" y="138" width="24" height="24" color="#ededf0"/>
  <text x="634" y="156" class="t" font-size="17" font-weight="700" fill="#ededf0">Your Onset server</text>
  <text x="634" y="174" class="t" font-size="12" fill="#a0a0a8">on a Windows PC you control</text>

  <rect x="600.5" y="184.5" width="299" height="63" rx="12" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="618" y="211" class="t" font-size="14" font-weight="700" fill="#ededf0">Control &amp; chat</text>
  <text x="884" y="211" class="m" font-size="12" fill="#c8c8cf" text-anchor="end">TCP 8080</text>
  <text x="618" y="232" class="t" font-size="12" fill="#a0a0a8">accounts · rooms · messages · files</text>

  <rect x="600.5" y="272.5" width="299" height="63" rx="12" fill="#1a1a1d" stroke="#46c07a" stroke-opacity="0.45"/>
  <text x="618" y="299" class="t" font-size="14" font-weight="700" fill="#ededf0">Voice relay</text>
  <text x="884" y="299" class="m" font-size="12" fill="#7fe0a6" text-anchor="end">UDP 9000</text>
  <text x="618" y="320" class="t" font-size="12" fill="#a0a0a8">re-encrypts for each listener</text>

  <rect x="600.5" y="360.5" width="299" height="63" rx="12" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="618" y="387" class="t" font-size="14" font-weight="700" fill="#ededf0">Screen-share SFU</text>
  <text x="884" y="387" class="m" font-size="12" fill="#c8c8cf" text-anchor="end">UDP 9001</text>
  <text x="618" y="408" class="t" font-size="12" fill="#a0a0a8">Pion WebRTC · forwards to viewers</text>

  <rect x="600.5" y="448.5" width="299" height="71" rx="12" fill="#0f0f11" stroke="#ffffff" stroke-opacity="0.08"/>
  <use href="#i-db" x="618" y="470" width="26" height="26" color="#a0a0a8"/>
  <text x="656" y="478" class="t" font-size="14" font-weight="700" fill="#ededf0">SQLite + uploaded files</text>
  <text x="656" y="499" class="t" font-size="12" fill="#a0a0a8">stored on the same PC</text>

  <!-- Manager -->
  <line x1="920" y1="238" x2="960" y2="238" stroke="#82828b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="960.5" y="150.5" width="199" height="175" rx="16" fill="#0f0f11" stroke="#ffffff" stroke-opacity="0.1"/>
  <use href="#i-panel" x="980" y="168" width="22" height="22" color="#ededf0"/>
  <text x="1010" y="184" class="t" font-size="14.5" font-weight="700" fill="#ededf0">Server Manager</text>
  <text x="980" y="210" class="m" font-size="11.5" fill="#a0a0a8">127.0.0.1:9090</text>
  <text x="980" y="228" class="t" font-size="12" fill="#82828b">opens only on this PC</text>
  <g class="t" font-size="12.5" fill="#c8c8cf">
    <circle cx="984" cy="254" r="2.5" fill="#82828b"/><text x="994" y="258">Start · stop · restart</text>
    <circle cx="984" cy="278" r="2.5" fill="#82828b"/><text x="994" y="282">Invite and identity</text>
    <circle cx="984" cy="302" r="2.5" fill="#82828b"/><text x="994" y="306">Encrypted backups</text>
  </g>

  <!-- Router -->
  <line x1="920" y1="430" x2="960" y2="430" stroke="#82828b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="960.5" y="356.5" width="199" height="163" rx="16" fill="#0f0f11" stroke="#ffffff" stroke-opacity="0.1"/>
  <use href="#i-router" x="980" y="372" width="24" height="24" color="#ededf0"/>
  <text x="1012" y="390" class="t" font-size="14.5" font-weight="700" fill="#ededf0">Your router</text>
  <text x="980" y="416" class="t" font-size="12" fill="#82828b">Internet mode only</text>
  <text x="980" y="444" class="t" font-size="12.5" fill="#c8c8cf">UPnP maps TCP 8080</text>
  <text x="980" y="464" class="t" font-size="12.5" fill="#c8c8cf">and UDP 9000, 9001,</text>
  <text x="980" y="484" class="t" font-size="12.5" fill="#c8c8cf">or forward them by hand</text>

  <!-- No third parties -->
  <rect x="40.5" y="560.5" width="1119" height="51" rx="14" fill="#46c07a" fill-opacity="0.07" stroke="#46c07a" stroke-opacity="0.35"/>
  <use href="#i-shield" x="60" y="574" width="24" height="24" color="#46c07a"/>
  <text x="96" y="591" class="t" font-size="14" fill="#c8c8cf"><tspan font-weight="700" fill="#7fe0a6">No third-party servers.</tspan> The developers run no accounts, relays or telemetry. Everything above is software on machines you and your people own.</text>
</svg>
